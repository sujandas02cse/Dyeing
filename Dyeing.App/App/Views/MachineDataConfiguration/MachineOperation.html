<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8" />
    <title>M/C Operation Configuration</title>

    <style>
        .md-datepicker-input {
            max-width: 200px;
            width: 190px;
        }

        .dropdown-menu {
            min-width: 12rem;
            /*min-height:250px !important;*/
        }

            .dropdown-menu dropdown-menu-form {
                height: 350px;
            }

        p {
            background: lightblue;
        }

        table {
            /*margin-bottom: 10px;*/
        }

        .finish_wrap {
            border-top: 1px solid #777;
            border-bottom: 1px solid #777;
        }

            .finish_wrap table {
                margin-bottom: 0px;
            }

                .finish_wrap table th,
                .finish_wrap table td {
                    border: 1px solid #9f9f9f !important;
                    padding: 5px 7px !important;
                    font-size: 12px;
                }

                .finish_wrap table th {
                    text-align: center;
                }

                .finish_wrap table td:nth-child(2) {
                }

        table:hover {
            /*background: #495057;*/
        }

        .machine_new table th img {
            width: 30px;
            margin: 5px;
        }

        .form-control {
            font-size: 20px !important;
        }

        .control-label {
            font-size: 20px;
            font-weight: bold;
            align-self: center;
        }

        .md-datepicker-input {
            width: 120px;
        }

        /*.input-height {
                    height: initial !important;
        }
        */
        .input-height {
            height: 85px !important;
        }

        input[type=checkbox] {
            transform: scale(1.5);
        }

        @media only screen and (min-height: 769px) {
            .card-body {
                height: calc(100vh - 210px);
            }

            .input-height {
                height: 75px !important;
            }

            .control-label {
                font-size: 25px;
                font-weight: bold;
                align-self: center;
            }

            .form-control {
                font-size: 25px !important;
            }
        }

        .dropdown-menu > li > a {
            font-size: 25px !important;
        }
    </style>


</head>
<body ng-controller="MachineOperationConfigController as ctrl">
    <div class="content-header sty-one">
        <h1>{{PageTitle}}</h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-angle-right"></i> {{ParentTitle}}</a></li>
            <li><i class="fa fa-angle-right"></i>{{PageTitle}}</li>
        </ol>
    </div>
    <div class="card card-body" style="min-height:500px;">
        <form id="form" name="form" ng-keypress="keyPressHandler($event)">
            <div ng-include src="'../../../App/Views/Shared/_LayoutUnit.html'"></div>

            <div class="form-group row">
                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4">
                            Batch:
                            <span class="required" style="color:red"> * </span>
                        </label>
                        <div class="col-md-8">

                            <input type="text"
                                   id="batch"
                                   auto-focus 
                                   ng-model="McOperation.BatchNo"
                                   typeahead-on-select="getDataByBatchId()"
                                   placeholder="Batch No.."
                                   class="form-control input-height"
                                   ng-virtual-keyboard="alphanumeric"
                                   typeahead-min-length="1"
                                   uib-typeahead="item as item.BatchNo for item in batchList | filter: {BatchNo:$viewValue}  | limitTo:8"
                                   ng-required="true">
                        </div>
                    </div>
                </div>
     
                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4 clsHeight">
                            M/C No:
                        </label>
                        <div class="col-md-8">
                            <!--<input type="text"
                                   ng-model="McOperation.MachineNo"
                                   ng-virtual-keyboard="{kt: 'Numpad', keyCenter: 4, size:5}"
                                   typeahead-min-length="1"
                                   uib-typeahead="item as item.MachineNo for item in MachineList | filter: {MachineNo:$viewValue}  | limitTo:8"
                                   typeahead-editable="false"
                                   class="form-control input-height clsHeight"
                                   ng-disabled="IsReadOnlyEndMode"
                                   required />-->


                            <input type="text"
                                   ng-model="McOperation.MachineNo"
                                     class="form-control input-height"
                                   ng-virtual-keyboard="alphanumeric"
                                   typeahead-min-length="1"
                                   uib-typeahead="item as item.MachineNo for item in MachineList | filter: {MachineNo:$viewValue}  | limitTo:8"
                                  
                                   ng-disabled="IsReadOnlyEndMode"
                                   required />


                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4 clsHeight">
                            Color:
                        </label>
                        <div class="col-md-8">
                            <input type="text" ng-model="McOperation.ColorName" readonly class="form-control input-height clsHeight" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4 clsHeight">
                            Job:
                        </label>
                        <div class="col-md-8">
                            <input type="text" ng-model="McOperation.JobName" readonly class="form-control input-height clsHeight" />
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4 clsHeight">
                            Style:
                        </label>
                        <div class="col-md-8">
                            <input type="text" ng-model="McOperation.StyleName" readonly class="form-control input-height clsHeight" />
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="row">
                        <label class="control-label col-md-4 clsHeight">
                            Order:
                        </label>
                        <div class="col-md-8">
                            <input type="text" ng-model="McOperation.OrderName" readonly class="form-control input-height clsHeight" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" style="margin-top: 10px; margin-bottom: 10px">

                <div class="col-md-12" ng-if="fabricList && fabricList.length>0" >

                    <table class="table table-bordered table-striped" style="font-size: 20px">
                        <thead>
                            <tr>
                                <th style="width:50px; text-align:center;">
                                    <!--<input type="checkbox"
    id="selectAll"
    ng-model="selectAll"
    ng-change="toggleAll()"
    ng-disabled="IsReadOnlyEndMode||IsHistoryView">-->
                                    <input type="checkbox"
                                           id="selectAll"
                                           ng-click="toggleAll($event)"
                                           ng-disabled="IsReadOnlyEndMode || IsHistoryView">
                                </th>
                                <!--<th>BodyPartId</th>-->
                                <th>BodyPart</th>
                                <!--<th>FabricTypeId</th>-->
                                <th>FabricType</th>
                                <th>Composition</th>
                                <th>Dia</th>
                                <th>GSM</th>
                                <!--<th>PlanQty</th>-->
                                <th>Quantity</th>
                                <!--<th>Status</th>-->
                                <th>Running Machine</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr ng-repeat="item in fabricList">
                                <td class="text-center">
                                    <input type="checkbox"
                                           ng-model="item.selected"
                                           ng-change="checkIfAllSelected()"
                                           ng-disabled="IsReadOnlyEndMode||IsHistoryView||item.isDisabled ">
                                </td>
                                <!--<td>{{item.BodyPartId}}</td>-->
                                <td>{{item.BodyPart}}</td>
                                <!--<td>{{item.FabricTypeId}}</td>-->
                                <td>{{item.FabricType}}</td>
                                <td>{{item.Composition}}</td>
                                <td>{{item.FDia}}</td>
                                <td>{{item.FGSM}}</td>
                                <!--<td>{{item.PlanQty}}</td>-->
                                <!--<td>{{item.ActualQty}}</td>-->

                                <td>
                                    <input type="number"
                                           ng-model="item.ActualQty"
                                           class="form-control"
                                           min="0"
                                           step="0.01"
                                           ng-disabled="IsReadOnlyEndMode||IsHistoryView||item.isDisabled"
                                           style="height:35px;font-size:18px;width:100px"/>
                                </td>

                                <!--<td>{{item.StatusName}}</td>-->
                                <td>{{item.RunningMachineNo}}</td>
                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>

            <!--<pre>{{fabricList | json}}</pre>-->

        <div class="form-group row">

            <div class="col-md-4">
                <div class="row">
                    <label class="control-label col-md-5 clsHeight">
                        Operation Time:
                    </label>
                    <div class="col-md-7">
      
                        <select ng-model="McOperation.OperationTime"
                                ng-options="item.OperationTime as item.OperationTimeName for item in OperationTimeList"
                                ng-change="OperationTimeChanged()"
                                class="form-control input-height clsHeight"
                              
                                ng-disabled="IsReadOnlyEndMode">
                            <option value="">Select</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="row">
                    <label class="control-label col-md-4 clsHeight">
                        Batch Start:
                    </label>
                    <div class="col-md-8">
                        <input class="form-control" type="text" disabled ng-model="McOperation.BatchStart" style="height:55px">
                    </div>
                </div>
            </div>


            <div class="col-md-4">
                <div class="row">
                    <label class="control-label col-md-4 clsHeight">
                        Batch End:
                    </label>
                    <div class="col-md-8">
                        <input class="form-control"
                               ng-model="McOperation.BatchEnd" type="text" disabled style="height:55px">
                    </div>
                </div>
            </div>


        </div>

            <div class="col-md-12 row" style="padding-top:10px;padding-bottom:10px;">
                <div class="offset-md-2 col-md-9">
                    <div ng-include src="'../../../App/Views/Shared/_LayoutActionButtonMcOperation.html'"></div>

                </div>
            </div>
        </form>
    </div>
</body>
</html>
